name: Test Basalam safe image remediation
on:
  push:
    branches: [codex/basalam-safe-images]
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint changed PHP files
        run: |
          set -euo pipefail
          php -l includes/BasalamSafeImageProcessor.php
          php -l includes/BasalamSafeImageService.php
          php -l includes/bootstrap.php
          php -l public/ajax/basalam_prepare_safe_images.php
          php -l public/basalam-safe-images.php
          php -l public/partials/header.php
