name: Inspect rejected unmapped Basalam products
on:
  push:
    branches: [ops/inspect-basalam-rejected-unmapped]
    paths:
      - '.github/workflows/inspect-basalam-rejected-unmapped.yml'
permissions:
  contents: read
env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect rejected products
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          cat > /tmp/inspect-rejected.php <<'PHP'
          <?php
          $root = rtrim((string)($argv[1] ?? ''), '/');
          require $root . '/includes/bootstrap.php';
          $client = new BasalamClient();
          $service = new BasalamSafeImageService();
          $db = Database::get();
          $maps = [];
          foreach ($db->query('SELECT wc_product_id, basalam_product_id FROM basalam_product_map WHERE basalam_product_id IS NOT NULL AND basalam_product_id > 0')->fetchAll() as $row) {
              $maps[(int)$row['basalam_product_id']] = (int)$row['wc_product_id'];
          }
          $items = [];
          for ($page=1; $page<=50; $page++) {
              $res = $client->getVendorProducts(['page'=>$page,'per_page'=>100]);
              if ($res['error']) break;
              $body = $res['body'] ?? [];
              $products = $body['data'] ?? $body['products'] ?? $body;
              if (!is_array($products) || !$products) break;
              $seen = 0;
              foreach ($products as $p) {
                  if (!is_array($p)) continue;
                  $id = (int)($p['id'] ?? 0); if ($id <= 0) continue; $seen++;
                  $status = $p['status'] ?? null;
                  $value = is_array($status) ? (int)($status['value'] ?? 0) : (is_numeric($status) ? (int)$status : 0);
                  if ($value !== 3567) continue;
                  $detail = $service->inspectBasalamProduct($id);
                  $items[] = [
                      'basalam' => $id,
                      'woo' => (int)($maps[$id] ?? 0),
                      'name' => (string)($p['name'] ?? $p['title'] ?? ''),
                      'illegal_count' => $detail['success'] ? count((array)($detail['illegal_photos'] ?? [])) : null,
                      'reasons' => $detail['success'] ? (array)($detail['reasons'] ?? []) : [],
                  ];
              }
              if ($seen < 100) break;
          }
          echo json_encode($items, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
          scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/inspect-rejected.php "$DEPLOY_USER@$DEPLOY_HOST:/tmp/inspect-rejected.php"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "php /tmp/inspect-rejected.php '$DEPLOY_PATH'; rc=\$?; rm -f /tmp/inspect-rejected.php; exit \$rc"
