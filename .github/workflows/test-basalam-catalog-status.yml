name: Test Basalam catalog status page
on:
  push:
    branches: [codex/basalam-catalog-status]
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Basalam catalog status files
        run: |
          set -euo pipefail
          php -l public/basalam-catalog.php
          php -l public/partials/header.php
