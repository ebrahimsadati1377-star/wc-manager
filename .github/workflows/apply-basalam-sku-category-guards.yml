name: Apply Basalam SKU category guards

on:
  push:
    branches:
      - codex/basalam-sku-category-guards
    paths:
      - .github/workflows/apply-basalam-sku-category-guards.yml
      - tools/apply-basalam-sku-category-guards.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/basalam-sku-category-guards
      - name: Patch source
        run: python3 tools/apply-basalam-sku-category-guards.py
      - name: Lint source
        run: php -l includes/BasalamSync.php
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply-basalam-sku-category-guards.py
          rm .github/workflows/apply-basalam-sku-category-guards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamSync.php tools/apply-basalam-sku-category-guards.py .github/workflows/apply-basalam-sku-category-guards.yml
          git commit -m "Guard Basalam SKU and category updates"
          git push origin HEAD:codex/basalam-sku-category-guards
