name: Apply Basalam Product Attribute Sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-basalam-attribute-sync.py'
      - '.github/workflows/apply-basalam-attribute-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-basalam-attribute-sync.py
          php -l includes/BasalamAttributeMapper.php
          php -l includes/BasalamSync.php
          php -l includes/bootstrap.php
          git diff --check
          git diff -- includes/BasalamSync.php
      - name: Commit attribute sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamSync.php
          git commit -m "Sync Woo product attributes to Basalam"
          git push origin HEAD:main
