name: Cleanup Basalam Attribute Test Scaffolding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-basalam-attribute-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-off files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            tools/basalam-inspect-attributes-2040.php \
            tools/apply-basalam-attribute-sync.py \
            tools/fix-basalam-attribute-care.py \
            .github/workflows/inspect-basalam-attributes-2040.yml \
            .github/workflows/apply-basalam-attribute-sync.yml \
            .github/workflows/fix-basalam-attribute-care.yml \
            .github/workflows/cleanup-basalam-attribute-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Basalam attribute test scaffolding"
          git push origin HEAD:main
