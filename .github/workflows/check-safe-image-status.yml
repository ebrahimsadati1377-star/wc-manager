name: Inspect generic Basalam image rejection reasons
on:
  push:
    branches: [ops/check-safe-image-status]
    paths:
      - '.github/workflows/check-safe-image-status.yml'
permissions:
  contents: read
env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect rejection payloads
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          cat > /tmp/inspect-generic-image.php <<'PHP'
          <?php
          $root = rtrim((string)($argv[1] ?? ''), '/');
          require $root . '/includes/bootstrap.php';
          $client = new BasalamClient();
          $targets = [57674352,57616625,57616575,57614412,57614404,57614384,57616704];
          $out = [];
          foreach ($targets as $bid) {
              $r = $client->getProduct($bid, true);
              $b = is_array($r['body'] ?? null) ? $r['body'] : [];
              $status = $b['status'] ?? null;
              $revision = is_array($b['revision'] ?? null) ? $b['revision'] : [];
              $meta = is_array($revision['metadata'] ?? null) ? $revision['metadata'] : [];
              $out[] = [
                  'basalam'=>$bid,
                  'name'=>(string)($b['name'] ?? $b['title'] ?? ''),
                  'status'=>$status,
                  'revision_rejection_reasons'=>$revision['rejection_reasons'] ?? null,
                  'revision_rejection_reason'=>$revision['rejection_reason'] ?? null,
                  'product_rejection_reasons'=>$b['rejection_reasons'] ?? null,
                  'product_rejection_reason'=>$b['rejection_reason'] ?? null,
                  'reject_reason'=>$b['reject_reason'] ?? null,
                  'illegal_count'=>is_array($meta['illegal_photos'] ?? null)?count($meta['illegal_photos']):0,
                  'metadata_description'=>$meta['description'] ?? null,
              ];
          }
          echo json_encode($out, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
          scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/inspect-generic-image.php "$DEPLOY_USER@$DEPLOY_HOST:/tmp/inspect-generic-image.php"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "php /tmp/inspect-generic-image.php '$DEPLOY_PATH'; rc=\$?; rm -f /tmp/inspect-generic-image.php; exit \$rc"
