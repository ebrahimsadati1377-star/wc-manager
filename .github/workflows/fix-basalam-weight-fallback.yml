name: Apply Basalam Weight Fallback Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-basalam-weight-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Basalam weight fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('includes/BasalamSync.php')
          text = path.read_text()
          old = '''        $weight = (float)($product['weight'] ?? 0);
        if ($weight > 0) {
            $weightInBasalamUnit = max(1, (int)round($weight * $weightMultiplier));
            $payload['weight'] = $weightInBasalamUnit;
            $defaultPackageWeight = max(0, (int)getSetting('basalam_default_package_weight', '0'));
            $payload['package_weight'] = max($weightInBasalamUnit, $defaultPackageWeight);
        } else {
            $defaultPackageWeight = max(0, (int)getSetting('basalam_default_package_weight', '0'));
            if ($defaultPackageWeight > 0) {
                $payload['package_weight'] = $defaultPackageWeight;
            }
        }
'''
          new = '''        $weight = (float)($product['weight'] ?? 0);
        $defaultPackageWeight = max(0, (int)getSetting('basalam_default_package_weight', '0'));
        if ($weight > 0) {
            $weightInBasalamUnit = max(1, (int)round($weight * $weightMultiplier));
            $payload['weight'] = $weightInBasalamUnit;
            $payload['package_weight'] = max($weightInBasalamUnit, $defaultPackageWeight);
        } elseif ($defaultPackageWeight > 0) {
            // Basalam requires a product weight (or decimal_weight) on create.
            // When Woo has no weight, use the configured default as a conservative fallback.
            $payload['weight'] = $defaultPackageWeight;
            $payload['package_weight'] = $defaultPackageWeight;
        }
'''
          if old not in text:
              raise SystemExit('Target weight block was not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l includes/BasalamSync.php
          git diff --check
          git diff -- includes/BasalamSync.php

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamSync.php
          git commit -m "Fix Basalam sync when Woo weight is missing"
          git push origin HEAD:main

