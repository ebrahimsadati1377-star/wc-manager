name: Map Basalam Woo 1693

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-basalam-1693.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Map existing Basalam product and force sync
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $wc = new WooCommerceClient();
          $client = new BasalamClient();
          $sync = new BasalamSync($wc, $client);

          $pRes = $wc->getProduct(1693);
          if ($pRes['error']) { echo 'WC_ERROR=' . $pRes['error'] . PHP_EOL; exit(1); }
          $p = $pRes['body'];

          $check = $client->getProduct(57616679, true);
          if ($check['error']) { echo 'BASALAM_READ_ERROR=' . $check['error'] . PHP_EOL; exit(1); }
          echo 'FOUND_ID=57616679' . PHP_EOL;

          $rm = new ReflectionMethod(BasalamSync::class, 'resolveBasalamCategory');
          $rm->setAccessible(true);
          $cat = $rm->invoke($sync, $p);
          if (!$cat) { echo 'NO_CATEGORY_MAP' . PHP_EOL; exit(1); }

          $hm = new ReflectionMethod(BasalamSync::class, 'computeWooHash');
          $hm->setAccessible(true);
          $hash = $hm->invoke($sync, $p, [], $cat);

          $sm = new ReflectionMethod(BasalamSync::class, 'saveProductMap');
          $sm->setAccessible(true);
          $sm->invoke($sync, 1693, 57616679, $hash, 'synced', null);

          $result = $sync->syncProduct(1693, true);
          echo 'SYNC=' . json_encode($result, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if (empty($result['success'])) exit(1);
          PHP
