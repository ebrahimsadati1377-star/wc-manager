name: Repair Basalam Woo 1983

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-basalam-1983.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Create base product then complete sync
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $wc = new WooCommerceClient();
          $client = new BasalamClient();
          $sync = new BasalamSync($wc, $client);
          $existing = $sync->getProductMap(1983);
          if ((int)($existing['basalam_product_id'] ?? 0) > 0) {
              echo 'ALREADY_MAPPED=' . (int)$existing['basalam_product_id'] . PHP_EOL;
              echo 'SYNC=' . json_encode($sync->syncProduct(1983, true), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              exit;
          }
          $pRes = $wc->getProduct(1983);
          if ($pRes['error']) { echo 'WC_ERROR=' . $pRes['error'] . PHP_EOL; exit(1); }
          $p = $pRes['body'];
          $vars = [];
          $rm = new ReflectionMethod(BasalamSync::class, 'resolveBasalamCategory'); $rm->setAccessible(true);
          $cat = $rm->invoke($sync, $p);
          if (!$cat) { echo 'NO_CATEGORY_MAP' . PHP_EOL; exit(1); }
          $bm = new ReflectionMethod(BasalamSync::class, 'buildProductPayload'); $bm->setAccessible(true);
          $payload = $bm->invoke($sync, $p, $vars, (int)$cat['basalam_category_id'], true);
          unset($payload['product_attribute'], $payload['photo'], $payload['photos']);
          $res = $client->createProduct($payload);
          echo 'CREATE_STATUS=' . ($res['status'] ?? 0) . PHP_EOL;
          echo 'CREATE_ERROR=' . ($res['error'] ?? '') . PHP_EOL;
          echo 'CREATE_BODY=' . json_encode($res['body'] ?? [], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if ($res['error']) exit(1);
          $id = (int)($res['body']['id'] ?? 0);
          if ($id <= 0) { echo 'NO_ID' . PHP_EOL; exit(1); }
          $hm = new ReflectionMethod(BasalamSync::class, 'computeWooHash'); $hm->setAccessible(true);
          $hash = $hm->invoke($sync, $p, $vars, $cat);
          $sm = new ReflectionMethod(BasalamSync::class, 'saveProductMap'); $sm->setAccessible(true);
          $sm->invoke($sync, 1983, $id, $hash, 'synced', null);
          echo 'MAPPED=' . $id . PHP_EOL;
          echo 'SYNC=' . json_encode($sync->syncProduct(1983, true), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
