name: Map Existing Basalam Woo 1983

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-basalam-1983.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Find exact existing product, map, sync
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $wc = new WooCommerceClient();
          $client = new BasalamClient();
          $sync = new BasalamSync($wc, $client);
          $pRes = $wc->getProduct(1983);
          if ($pRes['error']) { echo 'WC_ERROR=' . $pRes['error'] . PHP_EOL; exit(1); }
          $p = $pRes['body'];
          $target = trim((string)($p['name'] ?? ''));
          $norm = static function(string $s): string {
              $s = str_replace(['ي','ك'], ['ی','ک'], $s);
              $s = preg_replace('/\s+/u', ' ', trim($s)) ?? trim($s);
              return mb_strtolower($s, 'UTF-8');
          };
          $matches = [];
          for ($page=1; $page<=20; $page++) {
              $res = $client->getVendorProducts(['page'=>$page,'per_page'=>100]);
              if ($res['error']) { echo 'LIST_ERROR=' . $res['error'] . PHP_EOL; exit(1); }
              $body = $res['body'] ?? [];
              $items = $body['data'] ?? $body['products'] ?? $body;
              if (!is_array($items) || !$items) break;
              $count = 0;
              foreach ($items as $item) {
                  if (!is_array($item)) continue;
                  $count++;
                  $name = trim((string)($item['name'] ?? $item['title'] ?? ''));
                  if ($name !== '' && $norm($name) === $norm($target)) {
                      $matches[] = ['id'=>(int)($item['id']??0),'name'=>$name];
                  }
              }
              if ($count < 100) break;
          }
          echo 'TARGET=' . $target . PHP_EOL;
          echo 'MATCHES=' . json_encode($matches, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          $matches = array_values(array_filter($matches, fn($m)=>(int)$m['id']>0));
          if (count($matches) !== 1) { echo 'UNSAFE_MATCH_COUNT=' . count($matches) . PHP_EOL; exit(1); }
          $id = (int)$matches[0]['id'];
          $rm = new ReflectionMethod(BasalamSync::class, 'resolveBasalamCategory'); $rm->setAccessible(true);
          $cat = $rm->invoke($sync, $p);
          if (!$cat) { echo 'NO_CATEGORY_MAP' . PHP_EOL; exit(1); }
          $hm = new ReflectionMethod(BasalamSync::class, 'computeWooHash'); $hm->setAccessible(true);
          $hash = $hm->invoke($sync, $p, [], $cat);
          $sm = new ReflectionMethod(BasalamSync::class, 'saveProductMap'); $sm->setAccessible(true);
          $sm->invoke($sync, 1983, $id, $hash, 'synced', null);
          echo 'MAPPED=' . $id . PHP_EOL;
          $result = $sync->syncProduct(1983, true);
          echo 'SYNC=' . json_encode($result, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if (empty($result['success'])) exit(1);
          PHP
