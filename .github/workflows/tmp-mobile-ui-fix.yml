name: TEMP mobile UI fix
on:
  push:
    branches: [codex/mobile-ui-cache-fix]
    paths: ['.github/workflows/tmp-mobile-ui-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mobile-ui-cache-fix
      - name: Fix mobile responsive rendering and cache busting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/partials/header.php')
          s = p.read_text()
          marker = "$userInitial = function_exists('mb_substr') ? mb_substr($userName, 0, 1, 'UTF-8') : substr($userName, 0, 1);\n?>"
          repl = "$userInitial = function_exists('mb_substr') ? mb_substr($userName, 0, 1, 'UTF-8') : substr($userName, 0, 1);\n$styleFile = __DIR__ . '/../assets/css/style.css';\n$styleVersion = is_file($styleFile) ? (string)filemtime($styleFile) : '1';\n?>"
          if marker not in s:
              raise SystemExit('header php marker missing')
          s = s.replace(marker, repl, 1)
          s = s.replace('<link rel="stylesheet" href="assets/css/style.css">', '<link rel="stylesheet" href="assets/css/style.css?v=<?= e($styleVersion) ?>">', 1)
          css_marker = ':root{--app-nav-bg:#111827;--app-nav-border:rgba(255,255,255,.08);--app-nav-muted:#9ca3af;--app-nav-blue:#3b82f6}'
          critical = '''html,body{max-width:100%;overflow-x:hidden}\n.container-fluid{min-width:0}\n.app-page-head,.app-section-card,.app-mobile-card{min-width:0}\n@media(max-width:767.98px){.app-desktop-table{display:none!important}.app-mobile-list{display:block!important}.container-fluid.py-4{padding:1rem .8rem!important}.app-page-head{align-items:stretch;flex-direction:column;margin-bottom:1rem}.app-page-head__actions{display:grid;grid-template-columns:1fr}.app-page-head__actions .btn{width:100%;min-height:46px}}\n'''
          if critical not in s:
              s = s.replace(css_marker, css_marker + '\n' + critical, 1)
          p.write_text(s)

          p = Path('public/chatgpt.php')
          s = p.read_text()
          s = s.replace('<div class="table-responsive">\n        <table class="table align-middle mb-0">', '<div class="table-responsive app-desktop-table">\n        <table class="table align-middle mb-0">', 1)
          needle = '''      </div>\n      <?php endif; ?>\n    </section>\n\n    <section class="app-section-card">\n      <div class="app-section-card__head"><div><h2>Endpointها</h2>'''
          mobile = '''      </div>\n      <div class="app-mobile-list p-2">\n        <?php if ($envActive): ?>\n          <div class="app-mobile-card">\n            <div class="app-mobile-card__top"><div class="app-mobile-card__main"><div class="app-mobile-card__title">Environment token</div><div class="app-mobile-card__meta"><span>مدیریت از Environment</span><span class="badge text-bg-success">فعال</span></div></div></div>\n          </div>\n        <?php endif; ?>\n        <?php if ($legacyActive): ?>\n          <div class="app-mobile-card">\n            <div class="app-mobile-card__top"><div class="app-mobile-card__main"><div class="app-mobile-card__title">Legacy token</div><div class="app-mobile-card__meta"><span dir="ltr">legacy</span><span>نسخه قدیمی</span></div></div></div>\n            <div class="app-mobile-card__actions"><form method="post" class="d-grid" onsubmit="return confirm('توکن قدیمی باطل شود؟')"><input type="hidden" name="csrf_token" value="<?= e(csrfToken()) ?>"><input type="hidden" name="action" value="revoke_legacy"><button class="btn btn-outline-danger" type="submit"><i class="fas fa-ban ms-1"></i>ابطال</button></form></div>\n          </div>\n        <?php endif; ?>\n        <?php foreach ($tokens as $token): ?>\n          <div class="app-mobile-card">\n            <div class="app-mobile-card__top"><div class="app-mobile-card__main"><div class="app-mobile-card__title"><?= e($token['name']) ?></div><div class="app-mobile-card__meta"><span dir="ltr" style="overflow-wrap:anywhere"><?= e($token['id']) ?></span><?php if ($token['last4']): ?><span dir="ltr">…<?= e($token['last4']) ?></span><?php endif; ?><span dir="ltr"><?= e($token['created_at'] ?: '-') ?></span></div></div></div>\n            <div class="app-mobile-card__actions"><form method="post" class="d-grid" onsubmit="return confirm('این توکن باطل شود؟')"><input type="hidden" name="csrf_token" value="<?= e(csrfToken()) ?>"><input type="hidden" name="action" value="revoke_client"><input type="hidden" name="token_id" value="<?= e($token['id']) ?>"><button class="btn btn-outline-danger" type="submit"><i class="fas fa-ban ms-1"></i>ابطال</button></form></div>\n          </div>\n        <?php endforeach; ?>\n      </div>\n      <?php endif; ?>\n    </section>\n\n    <section class="app-section-card">\n      <div class="app-section-card__head"><div><h2>Endpointها</h2>'''
          if needle not in s:
              raise SystemExit('chatgpt table marker missing')
          s = s.replace(needle, mobile, 1)
          s = s.replace('.api-endpoint code{direction:ltr;display:block;overflow:auto;font-size:.72rem}', '.api-endpoint code{direction:ltr;display:block;max-width:100%;overflow:auto;font-size:.72rem;overflow-wrap:anywhere;word-break:break-all}')
          s = s.replace('.api-endpoint{display:flex;', '.api-endpoint{min-width:0;display:flex;', 1)
          p.write_text(s)
          PY
      - name: Validate PHP
        run: |
          php -l public/partials/header.php
          php -l public/chatgpt.php
          php -l public/categories.php
          php -l public/users.php
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/partials/header.php public/chatgpt.php
          git commit -m "Fix mobile UI rendering and stale CSS cache"
          git push origin codex/mobile-ui-cache-fix
