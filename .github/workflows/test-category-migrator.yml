name: Test Basalam category migrator
on:
  push:
    branches: [codex/basalam-category-migration]
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint category migration PHP
        run: |
          set -euo pipefail
          php -l includes/BasalamCategoryMigrator.php
          php -l public/ajax/basalam_category_migration.php
          php -l includes/bootstrap.php
