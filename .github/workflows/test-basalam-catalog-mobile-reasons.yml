name: Test Basalam catalog mobile and moderation details
on:
  push:
    branches: [codex/basalam-catalog-mobile-reasons]
    paths:
      - 'public/basalam-catalog.php'
      - 'public/ajax/basalam_product_status_detail.php'
      - '.github/workflows/test-basalam-catalog-mobile-reasons.yml'
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: |
          set -euo pipefail
          php -l public/basalam-catalog.php
          php -l public/ajax/basalam_product_status_detail.php
