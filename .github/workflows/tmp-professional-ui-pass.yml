name: TEMP finish professional UI pass
on:
  push:
    branches: [codex/professional-ui-pass]
    paths: ['.github/workflows/tmp-professional-ui-pass.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/professional-ui-pass
      - name: Polish remaining admin surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # add-post.php
          p = Path('public/add-post.php')
          s = p.read_text()
          s = s.replace("""<style>
  .ck-editor__editable_inline {
    min-height: 350px; /* ارتفاع استاندارد برای راحتی در نوشتن مقاله */
    font-size: 15px;
    line-height: 1.6;
  }
</style>

<div class=\"d-flex justify-content-between align-items-center mb-4\">
  <h3 class=\"m-0\">مدیریت مجله</h3>
  <a href=\"dashboard.php\" class=\"btn btn-outline-secondary px-3\">بازگشت به داشبورد</a>
</div>

<div class=\"card shadow-sm mb-4\">
  <div class=\"card-header bg-primary text-white fw-bold\">
    📝 افزودن مقاله جدید به مجله
  </div>
""", """<style>
  .ck-editor__editable_inline { min-height: 380px; font-size: 15px; line-height: 1.9; }
  .ck.ck-editor__main>.ck-editor__editable { border-radius: 0 0 12px 12px !important; }
  .ck.ck-toolbar { border-radius: 12px 12px 0 0 !important; border-color: #dfe4ea !important; }
  .article-editor-card .card-body { padding: clamp(1rem, 2vw, 1.35rem); }
  .article-publish-bar { display:flex;align-items:center;justify-content:flex-end;gap:.6rem;padding-top:.25rem; }
  @media(max-width:767.98px){.article-publish-bar{display:grid;grid-template-columns:1fr}.article-publish-bar .btn{width:100%}}
</style>

<div class=\"app-page-head\">
  <div class=\"app-page-head__copy\">
    <div class=\"app-page-head__eyebrow\"><i class=\"fas fa-pen-nib\"></i> مجله فروشگاه</div>
    <h1 class=\"app-page-head__title\">افزودن مقاله جدید</h1>
    <p class=\"app-page-head__subtitle\">محتوا، تصویر شاخص، دسته‌بندی و وضعیت انتشار را در یک فرم مدیریت کنید.</p>
  </div>
  <div class=\"app-page-head__actions\"><a href=\"manage-posts.php\" class=\"btn btn-outline-secondary\"><i class=\"fas fa-arrow-right ms-1\"></i>بازگشت به مقالات</a></div>
</div>

<div class=\"card article-editor-card mb-4\">
  <div class=\"card-header fw-bold\"><i class=\"fas fa-file-lines ms-1 text-primary\"></i>اطلاعات مقاله</div>
""")
          s = s.replace("""        <div class=\"col-md-12 text-end mt-4\">
          <button type=\"button\" id=\"submitPostBtn\" class=\"btn btn-success px-4\">
            🚀 انتشار مقاله
          </button>
        </div>
""", """        <div class=\"col-md-12 article-publish-bar mt-4\">
          <a href=\"manage-posts.php\" class=\"btn btn-outline-secondary\">انصراف</a>
          <button type=\"button\" id=\"submitPostBtn\" class=\"btn btn-primary px-4\"><i class=\"fas fa-paper-plane ms-1\"></i>ذخیره مقاله</button>
        </div>
""")
          # remove duplicate CKEditor include
          needle = '<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>\n\n<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>'
          s = s.replace(needle, '<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>')
          p.write_text(s)

          # edit-post.php
          p = Path('public/edit-post.php')
          s = p.read_text()
          s = s.replace("""<script src=\"https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js\"></script>

<div class=\"card shadow-sm mb-4\">
    <h3 class=\"card-header bg-primary text-white fw-bold\">ویرایش مقاله: <?= htmlspecialchars($post['title']['rendered']) ?></h3>
    <div class=\"card-body\">
""", """<script src=\"https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js\"></script>
<style>
  .ck-editor__editable_inline{min-height:380px;font-size:15px;line-height:1.9}.ck.ck-editor__main>.ck-editor__editable{border-radius:0 0 12px 12px!important}.ck.ck-toolbar{border-radius:12px 12px 0 0!important;border-color:#dfe4ea!important}.current-featured-image{max-width:220px;width:100%;height:auto;border:1px solid #e1e6ec;border-radius:14px;padding:5px;background:#fff}.article-savebar{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}@media(max-width:767.98px){.article-savebar{display:grid;grid-template-columns:1fr}.article-savebar .btn{width:100%}}
</style>
<div class=\"app-page-head\">
  <div class=\"app-page-head__copy\"><div class=\"app-page-head__eyebrow\"><i class=\"fas fa-pen-to-square\"></i> مجله فروشگاه</div><h1 class=\"app-page-head__title\">ویرایش مقاله</h1><p class=\"app-page-head__subtitle\"><?= htmlspecialchars($post['title']['rendered']) ?></p></div>
  <div class=\"app-page-head__actions\"><a href=\"manage-posts.php\" class=\"btn btn-outline-secondary\"><i class=\"fas fa-arrow-right ms-1\"></i>بازگشت به مقالات</a></div>
</div>
<div class=\"card mb-4\">
    <div class=\"card-header fw-bold\"><i class=\"fas fa-file-lines ms-1 text-primary\"></i>اطلاعات مقاله</div>
    <div class=\"card-body\">
""")
          s = s.replace('<label>عنوان:</label>', '<label class="form-label fw-bold">عنوان مقاله</label>')
          s = s.replace('<label>محتوا:</label>', '<label class="form-label fw-bold">محتوای مقاله</label>')
          s = s.replace('<label>تصویر شاخص (Featured Image):</label>', '<label class="form-label fw-bold">تصویر شاخص</label>')
          s = s.replace('<label>دسته‌بندی:</label>', '<label class="form-label fw-bold">دسته‌بندی</label>')
          s = s.replace('<label>وضعیت:</label>', '<label class="form-label fw-bold">وضعیت انتشار</label>')
          s = s.replace('style="max-width: 200px; height: auto; border: 1px solid #ddd; padding: 5px;"', 'class="current-featured-image"')
          s = s.replace('<button type="button" id="updateBtn" class="btn btn-primary">ذخیره تغییرات</button>', '<div class="article-savebar"><a href="manage-posts.php" class="btn btn-outline-secondary">انصراف</a><button type="button" id="updateBtn" class="btn btn-primary"><i class="fas fa-check ms-1"></i>ذخیره تغییرات</button></div>')
          p.write_text(s)

          # basalam.php header hierarchy only; keep integration logic intact.
          p = Path('public/basalam.php')
          s = p.read_text()
          old = """<div class=\"d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4\">
  <div>
    <h3 class=\"mb-1\">اتصال و سینک باسلام</h3>
    <div class=\"text-muted small\">WooCommerce مرجع اصلی محصول، قیمت و موجودی است.</div>
  </div>
  <span class=\"badge text-bg-<?= $basalam->isConfigured() ? 'success' : 'secondary' ?> px-3 py-2\">
    <?= $basalam->isConfigured() ? 'تنظیم‌شده' : 'تنظیم‌نشده' ?>
  </span>
</div>
"""
          new = """<div class=\"app-page-head\">
  <div class=\"app-page-head__copy\">
    <div class=\"app-page-head__eyebrow\"><i class=\"fas fa-bag-shopping\"></i> مارکت‌پلیس</div>
    <h1 class=\"app-page-head__title\">اتصال و تنظیمات باسلام</h1>
    <p class=\"app-page-head__subtitle\">WooCommerce مرجع اصلی محصول، قیمت و موجودی است؛ باسلام از همین اطلاعات همگام می‌شود.</p>
  </div>
  <div class=\"app-page-head__actions\"><span class=\"app-meta-chip\"><span class=\"app-status-dot <?= $basalam->isConfigured() ? 'success' : 'warning' ?>\"></span><?= $basalam->isConfigured() ? 'اتصال تنظیم شده' : 'نیاز به تنظیم' ?></span></div>
</div>
"""
          if old not in s:
              raise SystemExit('basalam header marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate PHP
        run: |
          php -l public/add-post.php
          php -l public/edit-post.php
          php -l public/basalam.php
          php -l public/categories.php
          php -l public/users.php
          php -l public/settings.php
          php -l public/chatgpt.php
      - name: Commit patches
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/add-post.php public/edit-post.php public/basalam.php
          git commit -m "Polish remaining admin and editorial surfaces"
          git push origin codex/professional-ui-pass
