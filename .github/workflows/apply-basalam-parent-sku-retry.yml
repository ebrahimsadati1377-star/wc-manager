name: Apply Basalam parent SKU retry fix

on:
  push:
    branches: [codex/basalam-parent-sku-retry]
    paths:
      - '.github/workflows/apply-basalam-parent-sku-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/basalam-parent-sku-retry
      - name: Patch parent update SKU conflict fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/BasalamSync.php')
          s = p.read_text()
          old = '''        if ($creating) {
            $basalamRes = $this->basalam->createProduct($payload);
        } else {
            $basalamProductId = (int)$map['basalam_product_id'];
            $parentPayload = $payload;
            unset($parentPayload['variants']);
            $basalamRes = $this->basalam->updateProduct($basalamProductId, $parentPayload);
        }
'''
          new = '''        if ($creating) {
            $basalamRes = $this->basalam->createProduct($payload);
        } else {
            $basalamProductId = (int)$map['basalam_product_id'];
            $parentPayload = $payload;
            unset($parentPayload['variants']);
            $basalamRes = $this->basalam->updateProduct($basalamProductId, $parentPayload);

            // Legacy Basalam catalogs can contain an inactive duplicate that still
            // owns the Woo SKU. The permanent Woo<->Basalam ID mapping is already
            // authoritative, so a duplicate SKU must not block all other updates.
            // Retry once without SKU and record the conflict in the activity log.
            if (
                $basalamRes['error']
                && isset($parentPayload['sku'])
                && str_contains((string)$basalamRes['error'], 'sku')
                && str_contains((string)$basalamRes['error'], 'یکتا')
            ) {
                $conflictingSku = (string)$parentPayload['sku'];
                unset($parentPayload['sku']);
                $retryRes = $this->basalam->updateProduct($basalamProductId, $parentPayload);
                if (!$retryRes['error']) {
                    $basalamRes = $retryRes;
                    logActivity(
                        'basalam_sync_sku_conflict',
                        'product:' . $wcProductId,
                        sprintf(
                            'Woo #%d -> Basalam #%d updated without duplicate SKU %s',
                            $wcProductId,
                            $basalamProductId,
                            $conflictingSku
                        )
                    );
                }
            }
        }
'''
          if old not in s:
              raise SystemExit('target update block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          php -l includes/BasalamSync.php
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-basalam-parent-sku-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamSync.php .github/workflows/apply-basalam-parent-sku-retry.yml
          git commit -m "Retry Basalam updates without duplicate parent SKU"
          git push origin HEAD:codex/basalam-parent-sku-retry
