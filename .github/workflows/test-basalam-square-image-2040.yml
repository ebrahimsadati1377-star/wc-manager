name: Test Basalam Square Image Woo 2040

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-basalam-square-image-2040.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Force sync and inspect image
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          echo 'IMG_ENGINE=' . (class_exists('Imagick') ? 'imagick' : (function_exists('imagecreatefromstring') ? 'gd' : 'none')) . PHP_EOL;
          $sync = new BasalamSync();
          $result = $sync->syncProduct(2040, true);
          echo 'SYNC=' . json_encode($result, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;

          $client = new BasalamClient();
          $product = $client->getProduct(57650781, true);
          $body = is_array($product['body'] ?? null) ? $product['body'] : [];
          echo 'PHOTO=' . json_encode($body['photo'] ?? null, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          echo 'PHOTOS=' . json_encode($body['photos'] ?? null, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;

          $urls = [];
          $walk = function ($value) use (&$walk, &$urls) {
              if (is_string($value) && preg_match('~^https?://~i', $value)) {
                  $urls[$value] = true;
                  return;
              }
              if (is_array($value)) {
                  foreach ($value as $item) $walk($item);
              }
          };
          $walk($body['photo'] ?? null);
          $walk($body['photos'] ?? null);
          foreach (array_slice(array_keys($urls), 0, 3) as $url) {
              $ch = curl_init($url);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 30, CURLOPT_SSL_VERIFYPEER => true, CURLOPT_FOLLOWLOCATION => true]);
              $bytes = curl_exec($ch);
              $status = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
              curl_close($ch);
              if (is_string($bytes) && $status >= 200 && $status < 300) {
                  $info = @getimagesizefromstring($bytes);
                  if (is_array($info)) echo 'DIM=' . $info[0] . 'x' . $info[1] . PHP_EOL;
              }
          }
          PHP
