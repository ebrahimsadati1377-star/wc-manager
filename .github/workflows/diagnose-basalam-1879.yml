name: Diagnose Basalam Woo 1879

on:
  push:
    branches: [tmp/diagnose-basalam-1879]
    paths:
      - '.github/workflows/diagnose-basalam-1879.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Reproduce update and print Basalam validation body
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $wc = new WooCommerceClient();
          $client = new BasalamClient();
          $sync = new BasalamSync($wc, $client);
          $pRes = $wc->getProduct(1879);
          if ($pRes['error']) { echo 'WC_ERROR=' . $pRes['error'] . PHP_EOL; exit(1); }
          $p = $pRes['body'];
          $map = $sync->getProductMap(1879);
          echo 'MAP=' . json_encode($map, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          $rm = new ReflectionMethod(BasalamSync::class, 'resolveBasalamCategory');
          $rm->setAccessible(true);
          $cat = $rm->invoke($sync, $p);
          echo 'CATEGORY=' . json_encode($cat, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          $bm = new ReflectionMethod(BasalamSync::class, 'buildProductPayload');
          $bm->setAccessible(true);
          $payload = $bm->invoke($sync, $p, [], (int)$cat['basalam_category_id'], false);
          if (getSetting('basalam_sync_attributes', '1') !== '0') {
              $mapper = new BasalamAttributeMapper($client);
              $ar = $mapper->build($p, [], (int)$cat['basalam_category_id'], 57504488);
              if (!empty($ar['attributes'])) $payload['product_attribute'] = array_values($ar['attributes']);
              echo 'ATTR_WARN=' . json_encode($ar['warnings'] ?? [], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          }
          echo 'WOO=' . json_encode([
            'id'=>1879,'name'=>$p['name']??null,'sku'=>$p['sku']??null,
            'price'=>$p['price']??null,'stock_quantity'=>$p['stock_quantity']??null,
            'weight'=>$p['weight']??null,'type'=>$p['type']??null
          ], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          echo 'PAYLOAD=' . json_encode($payload, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          $res = $client->updateProduct(57504488, $payload);
          echo 'STATUS=' . ($res['status'] ?? 0) . PHP_EOL;
          echo 'ERROR=' . ($res['error'] ?? '') . PHP_EOL;
          echo 'BODY=' . json_encode($res['body'] ?? [], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
