name: Verify Basalam Woo 1879

on:
  push:
    branches: [tmp/diagnose-basalam-1879]
    paths:
      - '.github/workflows/diagnose-basalam-1879.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync mapped Woo product and verify Basalam product
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $sync = new BasalamSync();
          $result = $sync->syncProduct(1879, false);
          echo 'SYNC=' . json_encode($result, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if (empty($result['success'])) exit(1);
          $client = new BasalamClient();
          $read = $client->getProduct(57504488, true);
          echo 'READ_ERROR=' . ($read['error'] ?? '') . PHP_EOL;
          echo 'PRODUCT=' . json_encode([
            'id'=>$read['body']['id'] ?? null,
            'name'=>$read['body']['name'] ?? null,
            'primary_price'=>$read['body']['primary_price'] ?? null,
            'stock'=>$read['body']['stock'] ?? null,
            'category_id'=>$read['body']['category']['id'] ?? ($read['body']['category_id'] ?? null),
            'status'=>$read['body']['status'] ?? null
          ], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
