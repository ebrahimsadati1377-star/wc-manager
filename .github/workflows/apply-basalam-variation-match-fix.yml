name: Apply Basalam Variation Match Fix
on:
  push:
    branches:
      - codex/basalam-existing-variation-match
    paths:
      - .github/workflows/apply-basalam-variation-match-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/basalam-existing-variation-match
      - name: Patch and lint
        env:
          PATCH_SCRIPT_B64: 
        run: |
          set -euo pipefail
          python3 -c "import os,base64;exec(base64.b64decode(os.environ['PATCH_SCRIPT_B64']))"
          php -l includes/BasalamSync.php
      - name: Commit source fix
        run: |
          set -euo pipefail
          rm .github/workflows/apply-basalam-variation-match-fix.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add includes/BasalamSync.php .github/workflows/apply-basalam-variation-match-fix.yml
          git commit -m 'Fix matching existing Basalam variations'
          git push origin HEAD:codex/basalam-existing-variation-match
