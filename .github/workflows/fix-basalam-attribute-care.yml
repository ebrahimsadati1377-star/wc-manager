name: Fix Basalam Attribute Care Extraction

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-basalam-attribute-care.py'
      - '.github/workflows/fix-basalam-attribute-care.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix-basalam-attribute-care.py
          php -l includes/BasalamAttributeMapper.php
          git diff --check
          git diff -- includes/BasalamAttributeMapper.php
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamAttributeMapper.php
          git commit -m "Refine Basalam care attribute extraction"
          git push origin HEAD:main
