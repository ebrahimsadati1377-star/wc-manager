name: Diagnose Woo 1862 and 1857 Basalam categories

on:
  push:
    branches: [tmp/diag-basalam-1695]
    paths:
      - '.github/workflows/diag-basalam-batch-errors.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect category state
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $wc = new WooCommerceClient();
          $client = new BasalamClient();
          $sync = new BasalamSync($wc, $client);
          $catRef = new ReflectionMethod(BasalamSync::class, 'resolveBasalamCategory');
          $catRef->setAccessible(true);
          foreach ([1862,1857] as $wooId) {
              $p = $wc->getProduct($wooId);
              $product = (array)($p['body'] ?? []);
              $map = $sync->getProductMap($wooId);
              $cat = $catRef->invoke($sync, $product);
              $basalamId = (int)($map['basalam_product_id'] ?? 0);
              $b = $basalamId > 0 ? $client->getProduct($basalamId, true) : ['body'=>[],'error'=>null];
              $bb = (array)($b['body'] ?? []);
              echo "CASE={$wooId}\n";
              echo 'WOO=' . json_encode(['name'=>$product['name']??null,'sku'=>$product['sku']??null,'categories'=>$product['categories']??[],'attributes'=>$product['attributes']??[]], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              echo 'CATEGORY_MAP=' . json_encode($cat, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              echo 'PRODUCT_MAP=' . json_encode($map, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              echo 'BASALAM=' . json_encode(['id'=>$basalamId,'name'=>$bb['name']??null,'sku'=>$bb['sku']??null,'category'=>$bb['category']??($bb['category_id']??null),'product_attribute'=>$bb['product_attribute']??($bb['attributes']??[])], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              echo 'BASALAM_ERROR=' . ($b['error'] ?? '') . PHP_EOL;
          }
          PHP
