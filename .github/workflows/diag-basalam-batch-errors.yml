name: Verify Basalam catalog error fixes

on:
  push:
    branches: [tmp/diag-basalam-1695]
    paths:
      - '.github/workflows/diag-basalam-batch-errors.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync affected products and verify
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $sync = new BasalamSync();
          $client = new BasalamClient();
          $mapRef = new ReflectionMethod(BasalamSync::class, 'getVariationMapsByProduct');
          $mapRef->setAccessible(true);
          $ids = [1083,1075,1061,1056,1043,1039,1036];
          $failed = false;
          foreach ($ids as $wooId) {
              $result = $sync->syncProduct($wooId, false);
              $map = $sync->getProductMap($wooId);
              $varMaps = $mapRef->invoke($sync, $wooId);
              echo "CASE={$wooId}\n";
              echo 'SYNC=' . json_encode($result, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              echo 'PRODUCT_MAP=' . json_encode($map, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              echo 'VAR_MAPS=' . json_encode($varMaps, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;

              if (empty($result['success'])) {
                  $failed = true;
                  continue;
              }
              $warnings = (array)($result['warnings'] ?? []);
              foreach ($warnings as $warning) {
                  if (str_contains((string)$warning, 'sku:') || str_contains((string)$warning, 'product_attribute:')) {
                      $failed = true;
                  }
              }
              if ($wooId !== 1056 && $warnings) {
                  $failed = true;
              }

              $basalamId = (int)($map['basalam_product_id'] ?? 0);
              if ($basalamId > 0) {
                  $b = $client->getProduct($basalamId, true);
                  $bb = (array)($b['body'] ?? []);
                  echo 'BASALAM=' . json_encode([
                    'id'=>$basalamId,
                    'sku'=>$bb['sku']??null,
                    'category'=>$bb['category']??($bb['category_id']??null),
                    'variants'=>$bb['variants']??[]
                  ], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              }
          }
          if ($failed) exit(1);
          PHP
