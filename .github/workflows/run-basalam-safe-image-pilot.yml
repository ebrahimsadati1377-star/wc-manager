name: Run Basalam safe image remediation batch
on:
  push:
    branches: [ops/basalam-safe-image-pilot]
    paths:
      - '.github/workflows/run-basalam-safe-image-pilot.yml'
permissions:
  contents: read
env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Remediate mapped Basalam image rejections
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          cat > /tmp/wc-safe-batch.php <<'PHP'
          <?php
          $root = rtrim((string)($argv[1] ?? ''), '/');
          require $root . '/includes/bootstrap.php';

          $service = new BasalamSafeImageService();
          $client = new BasalamClient();
          $db = Database::get();
          $maps = [];
          foreach ($db->query('SELECT wc_product_id, basalam_product_id FROM basalam_product_map WHERE basalam_product_id IS NOT NULL AND basalam_product_id > 0')->fetchAll() as $row) {
              $maps[(int)$row['basalam_product_id']] = (int)$row['wc_product_id'];
          }

          $keywords = ['حجاب', 'مو', 'چهره', 'صورت', 'پوشش', 'آرایش', 'مدل', 'تصویری'];
          $summary = ['eligible' => 0, 'success' => 0, 'failed' => 0, 'skipped_unmapped' => 0, 'skipped_non_image' => 0, 'items' => []];

          for ($page = 1; $page <= 50; $page++) {
              $res = $client->getVendorProducts(['page' => $page, 'per_page' => 100]);
              if ($res['error']) {
                  $summary['items'][] = ['type' => 'catalog_error', 'message' => $res['error']];
                  break;
              }
              $body = $res['body'] ?? [];
              $products = $body['data'] ?? $body['products'] ?? $body;
              if (!is_array($products) || !$products) break;
              $seen = 0;

              foreach ($products as $product) {
                  if (!is_array($product)) continue;
                  $id = (int)($product['id'] ?? 0);
                  if ($id <= 0) continue;
                  $seen++;
                  $status = $product['status'] ?? null;
                  $statusValue = is_array($status) ? (int)($status['value'] ?? 0) : (is_numeric($status) ? (int)$status : 0);
                  if ($statusValue !== 3567) continue;

                  $wcId = (int)($maps[$id] ?? 0);
                  if ($wcId <= 0) {
                      $summary['skipped_unmapped']++;
                      continue;
                  }

                  $detail = $service->inspectBasalamProduct($id);
                  if (!$detail['success'] || empty($detail['illegal_photos'])) {
                      $summary['skipped_non_image']++;
                      continue;
                  }

                  $reasonText = implode(' | ', (array)($detail['reasons'] ?? []));
                  $normalized = str_replace(['ي', 'ك'], ['ی', 'ک'], $reasonText);
                  $keywordMatch = false;
                  foreach ($keywords as $keyword) {
                      if ($keyword !== '' && str_contains($normalized, $keyword)) {
                          $keywordMatch = true;
                          break;
                      }
                  }
                  if (!$keywordMatch && $reasonText !== '') {
                      $summary['skipped_non_image']++;
                      $summary['items'][] = ['wc' => $wcId, 'basalam' => $id, 'result' => 'skipped_reason', 'reason' => $reasonText];
                      continue;
                  }

                  $summary['eligible']++;
                  $result = $service->prepareAndSubmit($wcId, 28);
                  if (!empty($result['success'])) {
                      $summary['success']++;
                      $summary['items'][] = [
                          'wc' => $wcId,
                          'basalam' => $id,
                          'result' => 'submitted',
                          'images' => (int)($result['image_count'] ?? 0),
                          'after_status' => $result['moderation_after']['status'] ?? null,
                          'warnings' => (array)($result['warnings'] ?? []),
                      ];
                  } else {
                      $summary['failed']++;
                      $summary['items'][] = [
                          'wc' => $wcId,
                          'basalam' => $id,
                          'result' => 'failed',
                          'message' => (string)($result['message'] ?? ''),
                      ];
                  }
                  echo 'PROGRESS ' . json_encode(end($summary['items']), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
                  flush();
              }
              if ($seen < 100) break;
          }

          echo 'SUMMARY ' . json_encode($summary, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
          scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/wc-safe-batch.php "$DEPLOY_USER@$DEPLOY_HOST:/tmp/wc-safe-batch.php"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" \
            "php /tmp/wc-safe-batch.php '$DEPLOY_PATH'; rc=\$?; rm -f /tmp/wc-safe-batch.php; exit \$rc"
