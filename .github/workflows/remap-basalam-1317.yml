name: Safely remap Woo 1317 to existing Basalam product

on:
  push:
    branches: [tmp/diag-basalam-1695]
    paths:
      - '.github/workflows/remap-basalam-1317.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Validate candidate, free legacy SKU, and sync
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';

          function normTitle(string $title): string {
              $title = html_entity_decode(strip_tags($title), ENT_QUOTES | ENT_HTML5, 'UTF-8');
              $title = str_replace(["\u{200c}","\u{200d}","\u{200e}","\u{200f}",'ي','ى','ك','ة','ۀ'],['','','','','ی','ی','ک','ه','ه'],$title);
              $title = function_exists('mb_strtolower') ? mb_strtolower($title,'UTF-8') : strtolower($title);
              $title = preg_replace('/[^\p{L}\p{N}]+/u',' ', $title) ?? $title;
              return preg_replace('/\s+/u',' ',trim($title)) ?? trim($title);
          }

          $wcId = 1317;
          $candidateId = 57616386;
          $legacyId = 54246762;
          $expectedCategoryId = 239;
          $db = Database::get();
          $wc = new WooCommerceClient();
          $client = new BasalamClient();
          $sync = new BasalamSync($wc, $client);

          $wooRes = $wc->getProduct($wcId);
          if ($wooRes['error']) throw new RuntimeException('Woo read failed: ' . $wooRes['error']);
          $woo = (array)$wooRes['body'];
          $wooTitle = (string)($woo['name'] ?? '');
          $wooSku = trim((string)($woo['sku'] ?? ''));

          $candidateRes = $client->getProduct($candidateId, true);
          if ($candidateRes['error']) throw new RuntimeException('Candidate read failed: ' . $candidateRes['error']);
          $candidate = (array)$candidateRes['body'];
          $candidateTitle = (string)($candidate['name'] ?? $candidate['title'] ?? '');
          $candidateCategory = (int)($candidate['category']['id'] ?? $candidate['category_id'] ?? 0);
          if (normTitle($wooTitle) !== normTitle($candidateTitle) || $candidateCategory !== $expectedCategoryId) {
              throw new RuntimeException('Candidate validation failed; refusing changes.');
          }

          $map = $sync->getProductMap($wcId);
          if ((int)($map['basalam_product_id'] ?? 0) !== $candidateId) {
              throw new RuntimeException('Woo product is not currently mapped to the validated candidate.');
          }
          $used = $db->prepare('SELECT wc_product_id FROM basalam_product_map WHERE basalam_product_id=:id LIMIT 1');
          $used->execute(['id'=>$candidateId]);
          if ((int)$used->fetchColumn() !== $wcId) {
              throw new RuntimeException('Candidate mapping ownership validation failed.');
          }

          $legacyRes = $client->getProduct($legacyId, true);
          if ($legacyRes['error']) throw new RuntimeException('Legacy product read failed: ' . $legacyRes['error']);
          $legacy = (array)$legacyRes['body'];
          $legacySku = trim((string)($legacy['sku'] ?? ''));
          $legacyCategory = (int)($legacy['category']['id'] ?? $legacy['category_id'] ?? 0);
          $legacyShowable = (bool)($legacy['is_showable'] ?? false);
          $legacyAvailable = (bool)($legacy['is_available'] ?? false);
          $legacyVariants = (array)($legacy['variants'] ?? []);
          $legacyUsed = $db->prepare('SELECT wc_product_id FROM basalam_product_map WHERE basalam_product_id=:id LIMIT 1');
          $legacyUsed->execute(['id'=>$legacyId]);
          $legacyMappedTo = $legacyUsed->fetchColumn();

          if (
              normTitle((string)($legacy['name'] ?? $legacy['title'] ?? '')) !== normTitle($wooTitle)
              || $legacyCategory !== $expectedCategoryId
              || $legacyShowable
              || $legacyAvailable
              || $legacyVariants
              || $legacyMappedTo !== false
              || $wooSku === ''
              || $legacySku !== $wooSku
          ) {
              throw new RuntimeException('Legacy duplicate is not safe to modify; refusing SKU release.');
          }

          echo 'LEGACY_BEFORE=' . json_encode([
              'id'=>$legacyId,'sku'=>$legacySku,'is_showable'=>$legacyShowable,'is_available'=>$legacyAvailable,
              'status'=>$legacy['status']??null
          ], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;

          // Release the SKU only from the inactive, unmapped duplicate. Nothing is deleted.
          $clear = $client->updateProduct($legacyId, ['sku'=>'']);
          if ($clear['error']) throw new RuntimeException('Clearing legacy SKU failed: ' . $clear['error']);
          $legacyAfterRes = $client->getProduct($legacyId, true);
          if ($legacyAfterRes['error']) throw new RuntimeException('Legacy verification failed: ' . $legacyAfterRes['error']);
          $legacyAfterSku = trim((string)($legacyAfterRes['body']['sku'] ?? ''));
          echo 'LEGACY_AFTER=' . json_encode(['id'=>$legacyId,'sku'=>$legacyAfterSku], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if ($legacyAfterSku !== '') throw new RuntimeException('Legacy SKU was not cleared.');

          $result = $sync->syncProduct($wcId, true);
          echo 'SYNC=' . json_encode($result, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          echo 'AFTER=' . json_encode($sync->getProductMap($wcId), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if (empty($result['success'])) throw new RuntimeException('Sync failed after safe SKU release: ' . ($result['message'] ?? 'unknown'));
          foreach ((array)($result['warnings'] ?? []) as $warning) {
              if (str_contains((string)$warning, 'دسته محصول باسلام')) {
                  throw new RuntimeException('Category mismatch warning remained after remap: ' . $warning);
              }
          }
          PHP
