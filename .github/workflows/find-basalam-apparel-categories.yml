name: Find relevant Basalam apparel categories

on:
  push:
    branches: [tmp/diag-basalam-1695]
    paths:
      - '.github/workflows/find-basalam-apparel-categories.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Search Basalam category tree
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $client = new BasalamClient();
          $res = $client->getCategories();
          if ($res['error']) { echo 'ERROR=' . $res['error'] . PHP_EOL; exit(1); }
          $hits = [];
          $walk = function($node, array $parents = []) use (&$walk, &$hits) {
              if (!is_array($node)) return;
              $title = trim((string)($node['title'] ?? $node['name'] ?? ''));
              $id = (int)($node['id'] ?? 0);
              $path = $parents;
              if ($title !== '') $path[] = $title;
              if ($id > 0 && $title !== '' && preg_match('/(ست|اورال|سرهمی|شلوار|شومیز|بلوز|پیراهن|مانتو|تونیک|دامن|تاپ|تیشرت|زنانه|دخترانه)/u', $title)) {
                  $hits[$id] = ['id'=>$id,'title'=>$title,'path'=>implode(' > ', $path)];
              }
              foreach (['children','categories','items','data'] as $key) {
                  if (!isset($node[$key]) || !is_array($node[$key])) continue;
                  foreach ($node[$key] as $child) $walk($child, $path);
              }
          };
          $body = $res['body'] ?? [];
          foreach ((array)$body as $node) $walk($node, []);
          ksort($hits);
          foreach ($hits as $hit) echo 'CATEGORY=' . json_encode($hit, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
