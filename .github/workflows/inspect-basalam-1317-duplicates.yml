name: Inspect Basalam duplicate products for Woo 1317

on:
  push:
    branches: [tmp/diag-basalam-1695]
    paths:
      - '.github/workflows/inspect-basalam-1317-duplicates.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect old and candidate products
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && php" <<'PHP'
          <?php
          require_once 'includes/bootstrap.php';
          $client = new BasalamClient();
          foreach ([54246762,57616386] as $id) {
              $r = $client->getProduct($id, true);
              $b = (array)($r['body'] ?? []);
              echo 'PRODUCT=' . json_encode([
                  'id'=>$id,
                  'error'=>$r['error'],
                  'name'=>$b['name']??$b['title']??null,
                  'sku'=>$b['sku']??null,
                  'status'=>$b['status']??null,
                  'is_available'=>$b['is_available']??null,
                  'is_showable'=>$b['is_showable']??null,
                  'stock'=>$b['stock']??null,
                  'category_id'=>$b['category']['id']??$b['category_id']??null,
                  'variants'=>$b['variants']??[],
              ], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          }
          $list = $client->getVendorProducts(['title'=>'شلوار جاگردمپا گت دار','page'=>1,'per_page'=>100]);
          echo 'TITLE_SEARCH=' . json_encode($list['body']??[], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
