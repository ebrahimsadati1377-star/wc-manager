name: Patch Basalam duplicate SKU fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-basalam-sku-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch BasalamClient update retry
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_basalam_sku.py
          python3 /tmp/patch_basalam_sku.py
          php -l includes/BasalamClient.php
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamClient.php
          git commit -m "Retry mapped Basalam updates without conflicting SKU"
          git push origin HEAD:main
