name: Apply Basalam Update Guard

on:
  push:
    branches: [codex/basalam-update-immutable-category]
    paths:
      - '.github/workflows/apply-basalam-update-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/basalam-update-immutable-category
      - name: Patch Basalam update handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/BasalamClient.php')
          s = p.read_text()
          old = "    public function updateProduct(int $productId, array $data): array\n    {\n        return $this->request('PATCH', '/v1/products/' . $productId, [], $data);\n    }\n"
          new = "    public function updateProduct(int $productId, array $data): array\n    {\n        // Basalam does not allow changing category_id after a product is created.\n        // Existing Woo→Basalam mappings may use a newer Woo category mapping, so\n        // never send category_id on PATCH; creation still sends it normally.\n        unset($data['category_id']);\n        return $this->request('PATCH', '/v1/products/' . $productId, [], $data);\n    }\n"
          if old not in s:
              raise SystemExit('updateProduct target not found')
          s = s.replace(old, new, 1)
          marker = "        if (!empty($body['errors']) && is_array($body['errors'])) {\n"
          insert = (
              "        if (!empty($body['messages']) && is_array($body['messages'])) {\n"
              "            $messages = [];\n"
              "            foreach ($body['messages'] as $item) {\n"
              "                if (!is_array($item)) {\n"
              "                    continue;\n"
              "                }\n"
              "                $message = trim((string)($item['message'] ?? ''));\n"
              "                if ($message === '') {\n"
              "                    continue;\n"
              "                }\n"
              "                $fields = array_values(array_filter(array_map(\n"
              "                    static fn($field) => trim((string)$field),\n"
              "                    (array)($item['fields'] ?? [])\n"
              "                )));\n"
              "                $messages[] = $fields ? implode(', ', $fields) . ': ' . $message : $message;\n"
              "            }\n"
              "            if ($messages) {\n"
              "                return implode(' | ', $messages);\n"
              "            }\n"
              "        }\n\n"
          )
          if marker not in s:
              raise SystemExit('extractApiError target not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          php -l includes/BasalamClient.php
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-basalam-update-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamClient.php .github/workflows/apply-basalam-update-guard.yml
          git commit -m "Fix Basalam updates for immutable categories"
          git push origin HEAD:codex/basalam-update-immutable-category
