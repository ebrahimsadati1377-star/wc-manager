name: Patch persistent Basalam safe-image mode
on:
  push:
    branches: [codex/persist-basalam-safe-images]
    paths:
      - '.github/workflows/patch-persist-safe-images.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persist-basalam-safe-images
      - name: Patch BasalamSync image uploader
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/BasalamSync.php')
          text = p.read_text()
          anchor = """        $maxImages = min(10, max(1, (int)getSetting('basalam_max_images', '6')));\n        $ids = [];\n\n        foreach (array_slice($product['images'] ?? [], 0, $maxImages) as $image) {"""
          replacement = """        $maxImages = min(10, max(1, (int)getSetting('basalam_max_images', '6')));\n        $ids = [];\n        $safeCropTopPercent = 0;\n\n        // Once a product has been remediated for Basalam image moderation, keep\n        // using the safe Basalam-only crop on future force-syncs. Woo originals\n        // remain untouched and the policy can be reset by removing the job row.\n        $wcProductId = (int)($product['id'] ?? 0);\n        if ($wcProductId > 0) {\n            try {\n                $stmt = $this->db->prepare(\n                    \"SELECT crop_top_percent FROM basalam_safe_image_jobs\n                     WHERE wc_product_id = :id AND last_status = 'submitted' LIMIT 1\"\n                );\n                $stmt->execute(['id' => $wcProductId]);\n                $safeJob = $stmt->fetch();\n                if (is_array($safeJob)) {\n                    $safeCropTopPercent = max(15, min(40, (int)($safeJob['crop_top_percent'] ?? 28)));\n                }\n            } catch (Throwable $e) {\n                // Table may not exist yet on older installs; fall back to normal images.\n                $safeCropTopPercent = 0;\n            }\n        }\n\n        foreach (array_slice($product['images'] ?? [], 0, $maxImages) as $image) {"""
          if anchor not in text:
              raise SystemExit('anchor not found')
          text = text.replace(anchor, replacement, 1)
          old = "            $upload = BasalamImageProcessor::upload($this->basalam, $url);"
          new = """            $upload = $safeCropTopPercent > 0\n                ? BasalamSafeImageProcessor::upload($this->basalam, $url, $safeCropTopPercent)\n                : BasalamImageProcessor::upload($this->basalam, $url);"""
          if old not in text:
              raise SystemExit('upload line not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          php -l includes/BasalamSync.php
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/BasalamSync.php
          git commit -m "Keep Basalam safe images on future syncs"
          git push origin HEAD:codex/persist-basalam-safe-images
