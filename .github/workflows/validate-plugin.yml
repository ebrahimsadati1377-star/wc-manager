name: Validate plugin readiness

on:
  pull_request:
    paths:
      - '**/*.php'
      - '.codex-plugin/**'
      - 'public/.well-known/**'
      - 'PLUGIN_SUBMISSION.md'
      - '.github/workflows/validate-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          echo "PHP lint passed."

      - name: Validate plugin manifest and OAuth metadata JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool public/.well-known/oauth-protected-resource >/dev/null
          python3 -m json.tool public/.well-known/oauth-authorization-server >/dev/null
          echo "Plugin/OAuth JSON validation passed."

      - name: Check required submission files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/mcp.php
          test -s includes/OAuthService.php
          test -s public/oauth/authorize.php
          test -s public/oauth/token.php
          test -s public/plugin.php
          test -s PLUGIN_SUBMISSION.md
          test -s public/.well-known/openai-apps-challenge
          echo "Submission files present."
